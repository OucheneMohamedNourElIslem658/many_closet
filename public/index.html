<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link href="https://fonts.googleapis.com/css2?family=Volkhov:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <!-- Primary Meta Tags -->
    <title>Many Closet</title>
    <meta name="title" content="Many Closet">
    <meta name="description" content="Discover and shop from a wide variety of fashionable clothes at Many Closet.">

    <!-- Open Graph / Facebook / WhatsApp / Telegram / Discord -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://many-closet.vercel.app/">
    <meta property="og:title" content="Many Closet">
    <meta property="og:description" content="Discover and shop from a wide variety of fashionable clothes at Many Closet.">
    <meta property="og:image" content="https://fra.cloud.appwrite.io/v1/storage/buckets/shop/files/many-closet/view?project=67fc030f003b267f06de">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://many-closet.vercel.app/">
    <meta name="twitter:title" content="Many Closet">
    <meta name="twitter:description" content="Discover and shop from a wide variety of fashionable clothes at Many Closet.">
    <meta name="twitter:image" content="https://fra.cloud.appwrite.io/v1/storage/buckets/shop/files/many-closet/view?project=67fc030f003b267f06de">

    <!-- LinkedIn / General SEO -->
    <meta itemprop="name" content="Many Closet">
    <meta itemprop="description" content="Discover and shop from a wide variety of fashionable clothes at Many Closet.">
    <meta itemprop="image" content="https://fra.cloud.appwrite.io/v1/storage/buckets/shop/files/many-closet/view?project=67fc030f003b267f06de">

  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

</html>
